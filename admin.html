<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radhika Car Rentals — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F7F3EA; --paper-line:#E3DAC3; --charcoal:#211E1B; --charcoal-soft:#33302B;
    --taxi:#F3B300; --taxi-deep:#C98F00; --tram:#2E5233; --tram-soft:#3E6B46; --white:#FFFFFF; --maroon:#7A2E2E;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--cream); color:var(--charcoal); font-family:'Work Sans',sans-serif;}
  h1{font-family:'Big Shoulders Display',sans-serif; font-weight:800; margin:0;}
  .topbar{background:var(--charcoal); color:var(--cream); padding:16px 28px; display:flex; justify-content:space-between; align-items:center;}
  .topbar h1{font-size:26px;}
  .topbar .mark span{color:var(--taxi);}
  #signout{background:none; border:1px solid #5A564C; color:var(--cream); padding:8px 16px; border-radius:2px; cursor:pointer; font-family:inherit; font-size:13.5px;}
  #signout:hover{border-color:var(--cream);}

  .wrap{max-width:1100px; margin:0 auto; padding:28px;}

  #login-screen{
    max-width:380px; margin:80px auto; background:var(--white); border:1px solid var(--paper-line);
    padding:32px; border-radius:2px;
  }
  #login-screen h2{font-family:'Work Sans'; font-size:20px; font-weight:700; margin:0 0 18px;}
  #login-screen label{display:block; font-size:12.5px; font-weight:600; margin-bottom:5px;}
  #login-screen input{width:100%; padding:10px 12px; margin-bottom:14px; border:1.5px solid var(--paper-line); border-radius:2px; font-family:inherit; font-size:14.5px;}
  #login-screen button{width:100%; background:var(--taxi); border:none; padding:12px; font-weight:700; border-radius:2px; cursor:pointer; font-family:inherit;}
  #login-screen button:hover{background:var(--taxi-deep);}
  #login-error{color:var(--maroon); font-size:13px; margin-top:10px; min-height:16px;}

  #dashboard{display:none;}

  .filters{display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;}
  .filters button{
    background:var(--white); border:1.5px solid var(--paper-line); padding:8px 16px;
    border-radius:20px; font-family:inherit; font-size:13.5px; font-weight:600; cursor:pointer;
  }
  .filters button.active{background:var(--charcoal); color:var(--cream); border-color:var(--charcoal);}

  table{width:100%; border-collapse:collapse; background:var(--white); border:1px solid var(--paper-line);}
  th, td{text-align:left; padding:12px 14px; font-size:13.5px; border-bottom:1px solid var(--paper-line);}
  th{background:var(--charcoal); color:var(--cream); font-weight:600; font-size:12.5px;}
  tr:last-child td{border-bottom:none;}

  .badge{display:inline-block; padding:3px 10px; border-radius:20px; font-size:11.5px; font-weight:700;}
  .badge.pending{background:#FCE9C2; color:#8A5A00;}
  .badge.confirmed{background:#DCEBDD; color:var(--tram);}
  .badge.completed{background:#DDE3EA; color:#33475B;}
  .badge.cancelled{background:#F4D9D9; color:var(--maroon);}

  .row-actions{display:flex; gap:6px; flex-wrap:wrap;}
  .row-actions button{
    font-size:11.5px; padding:5px 9px; border-radius:2px; border:1px solid var(--paper-line);
    background:var(--white); cursor:pointer; font-family:inherit;
  }
  .row-actions button:hover{background:var(--cream);}

  #empty-state{padding:40px; text-align:center; color:var(--charcoal-soft); background:var(--white); border:1px solid var(--paper-line);}
</style>
</head>
<body>

<div class="topbar">
  <h1 class="mark">Radhika<span>.</span> Admin</h1>
  <button id="signout" style="display:none;">Sign out</button>
</div>

<div id="login-screen">
  <h2>Sign in to manage bookings</h2>
  <label for="email">Email</label>
  <input type="email" id="email" autocomplete="username">
  <label for="password">Password</label>
  <input type="password" id="password" autocomplete="current-password">
  <button id="loginbtn">Sign in</button>
  <div id="login-error"></div>
</div>

<div class="wrap" id="dashboard">
  <div class="filters">
    <button data-filter="all" class="active">All</button>
    <button data-filter="pending">Pending</button>
    <button data-filter="confirmed">Confirmed</button>
    <button data-filter="completed">Completed</button>
    <button data-filter="cancelled">Cancelled</button>
  </div>
  <div id="table-holder"></div>
</div>

<script type="module">
  // TODO: paste the SAME config object you used in index.html
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import { getFirestore, collection, onSnapshot, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCQ4vzP0XzJPkqKVMJK5y3ZyWxRUKhwJjc",
    authDomain: "radhika-car-rentals.firebaseapp.com",
    databaseURL: "https://radhika-car-rentals-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "radhika-car-rentals",
    storageBucket: "radhika-car-rentals.firebasestorage.app",
    messagingSenderId: "985093595023",
    appId: "1:985093595023:web:adcf80d072f4589e84b5fa",
    measurementId: "G-38K70R2NF2"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const loginScreen = document.getElementById('login-screen');
  const dashboard = document.getElementById('dashboard');
  const signoutBtn = document.getElementById('signout');
  let allBookings = [];
  let currentFilter = 'all';

  document.getElementById('loginbtn').addEventListener('click', async () => {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errEl = document.getElementById('login-error');
    errEl.textContent = '';
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (err) {
      errEl.textContent = 'Could not sign in — check your email and password.';
    }
  });

  signoutBtn.addEventListener('click', () => signOut(auth));

  onAuthStateChanged(auth, (user) => {
    if (user) {
      loginScreen.style.display = 'none';
      dashboard.style.display = 'block';
      signoutBtn.style.display = 'inline-block';
      listenForBookings();
    } else {
      loginScreen.style.display = 'block';
      dashboard.style.display = 'none';
      signoutBtn.style.display = 'none';
    }
  });

  function listenForBookings(){
    const q = query(collection(db, 'bookings'), orderBy('createdAt', 'desc'));
    onSnapshot(q, (snapshot) => {
      allBookings = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    });
  }

  async function setStatus(id, status){
    await updateDoc(doc(db, 'bookings', id), { status });
  }

  document.querySelectorAll('.filters button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      render();
    });
  });

  function render(){
    const holder = document.getElementById('table-holder');
    const rows = currentFilter === 'all' ? allBookings : allBookings.filter(b => (b.status || 'pending') === currentFilter);

    if (rows.length === 0) {
      holder.innerHTML = '<div id="empty-state">No bookings here yet.</div>';
      return;
    }

    const trs = rows.map(b => {
      const when = b.createdAt && b.createdAt.toDate ? b.createdAt.toDate().toLocaleString() : '—';
      const status = b.status || 'pending';
      const detail = b.type === 'quote'
        ? `${b.carType || ''} · ${b.tripType || ''} · pickup ${b.pickupDate || '—'}`
        : (b.message || '—');
      const who = b.name || b.phone || '—';

      return `<tr>
        <td>${when}</td>
        <td>${escapeHtml(who)}</td>
        <td>${escapeHtml(b.phone || '—')}</td>
        <td>${escapeHtml(detail)}</td>
        <td><span class="badge ${status}">${status}</span></td>
        <td class="row-actions">
          <button onclick="window.__setStatus('${b.id}','confirmed')">Confirm</button>
          <button onclick="window.__setStatus('${b.id}','completed')">Complete</button>
          <button onclick="window.__setStatus('${b.id}','cancelled')">Cancel</button>
        </td>
      </tr>`;
    }).join('');

    holder.innerHTML = `<table>
      <thead><tr><th>Received</th><th>Name / who</th><th>Phone</th><th>Details</th><th>Status</th><th>Update</th></tr></thead>
      <tbody>${trs}</tbody>
    </table>`;
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }

  window.__setStatus = setStatus;
</script>

</body>
</html>
